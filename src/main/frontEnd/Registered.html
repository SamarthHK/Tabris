<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Remixxer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f0a374, #fff6f1);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: linear-gradient(to right, #ff7a1a, #ff7aa8, #a044ff);
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
        }
        h1 {
            color: #d9dceb;
            margin: 0 0 20px 0;
            font-size: 28px;
        }
        p {
            color: #e6e3e9;
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }
        .button {
            background: linear-gradient(135deg, #a044ff, #ff7a1a);
            color: rgb(209, 209, 209);
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello, thank you for using Remixxer</h1>
        <p>Your account has been successfully created. Welcome to the Remixxer community!</p>
        <a href="main.html" class="button">Get Started</a>
    </div>
</body>
</html>
